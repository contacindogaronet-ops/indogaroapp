name: JARGO Core Quality and Build Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

jobs:
  verify-and-build:
    name: Gatekeeper and Build System
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./indogaroapp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate Dynamic Wrapper
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x ./gradlew

      - name: Module Resolution Check
        run: ./gradlew :app:tasks --dry-run

      - name: Static Code Analysis
        run: ./gradlew :app:lintDevDebug --quiet

      - name: Assemble Core Engine
        run: ./gradlew :app:assembleDevDebug --stacktrace --parallel

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JARGO-Core-Dev-Build
          path: indogaroapp/app/build/outputs/apk/dev/debug/*.apk
          retention-days: 7
