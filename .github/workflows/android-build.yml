name: JARGO Core Quality & Build Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]

env:
  # Optimasi isolasi memori & matikan daemon statis
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

jobs:
  verify-and-build:
    name: Gatekeeper & Build System
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./indogaroapp

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔒 Integrity Check: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: 🛡️ Pre-flight Check: Module Resolution
        run: |
          chmod +x ./gradlew
          ./gradlew :app:tasks --dry-run

      - name: 🔬 Quality Gate: Static Code Analysis (Lint)
        run: ./gradlew :app:lintDevDebug --quiet

      - name: 🏗️ Execute Build: Assemble Core Engine
        run: ./gradlew :app:assembleDevDebug --stacktrace --parallel

      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JARGO-Core-Dev-Build
          path: indogaroapp/app/build/outputs/apk/dev/debug/*.apk
          retention-days: 7
